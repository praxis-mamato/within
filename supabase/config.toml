# Supabase project configuration, deployed by the Supabase GitHub integration.
# Only the settings Within depends on are listed; everything else uses Supabase defaults.
project_id = "within"

[auth]
site_url = "https://within-oracle.withinoracle.workers.dev/"
additional_redirect_urls = ["https://within-oracle.withinoracle.workers.dev/", "https://praxis-mamato.github.io/within/", "http://localhost:5173/", "http://localhost:4173/"]

[auth.email]
# The email link is the second sign-in step (docs/next-features.md B1).
enable_signup = false
otp_expiry = 900

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

# Stripe calls this without a Supabase session; the function checks Stripe's signature instead.
[functions.stripe-webhook]
verify_jwt = false

# Supabase Auth as an OAuth 2.1 server, so people can connect their Within account to Claude
# (the plugin in plugin/, the connector in mcp/). Claude registers itself (dynamic registration);
# people approve each connection on the consent page (app/src/screens/ConnectClaude.tsx).
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true
