name: iPhone app
# Builds the iPhone app (app/ios, Capacitor) on a GitHub Mac, so no Mac is needed. Without Apple keys it
# only checks that the app compiles. With the App Store Connect API key saved as repository secrets
# (APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8) and the team ID as a variable (APPLE_TEAM_ID),
# a manual run signs it and uploads it to TestFlight. Mac minutes are costly, so it runs by hand or when
# the iPhone project itself changes.
on:
  push:
    branches: [claude/epic-gates-6t5iqb]
    paths: ['app/ios/**', 'app/capacitor.config.ts', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to TestFlight
        type: boolean
        default: false

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Check it compiles (no signing)
        if: ${{ !inputs.upload }}
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Sign and upload to TestFlight
        if: ${{ inputs.upload }}
        run: |
          test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$KEY_P8" && test -n "$TEAM_ID" || { echo "::error::Add the App Store Connect key secrets and APPLE_TEAM_ID first."; exit 1; }
          mkdir -p ~/private_keys && printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          BUILD=$(date +%Y%m%d%H%M)
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Within.xcarchive DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD $AUTH archive | tail -20
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Within.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out $AUTH | tail -20
