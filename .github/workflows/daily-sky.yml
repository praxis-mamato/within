# Rebuilds the site once a day, so "Astrology today" and the lunation pages show the current sky.
# It updates app/public/sky-date.txt and pushes; the push starts the usual deploy and search notices.
name: Daily sky
on:
  schedule:
    - cron: '7 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/epic-gates-6t5iqb
      - run: |
          date -u +%F > app/public/sky-date.txt
          git config user.name "within-bot"
          git config user.email "within-bot@users.noreply.github.com"
          git add app/public/sky-date.txt
          git diff --cached --quiet || git commit -m "Daily sky refresh $(date -u +%F)"
          git push origin HEAD:claude/epic-gates-6t5iqb
