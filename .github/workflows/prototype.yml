name: Prototype checks
on:
  push:
    paths: ['app/**', 'mcp/**', 'ops/safety/fixtures/**', '.github/workflows/prototype.yml']
  pull_request:
    paths: ['app/**', 'mcp/**', 'ops/safety/fixtures/**', '.github/workflows/prototype.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # The Claude connector (mcp/) runs the app's chart engine, so it needs the app's packages too.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: mcp
      - run: npm run typecheck
        working-directory: mcp
      - run: npm test
        working-directory: mcp
  accessibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
